<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helicity To LS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .input-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        .input-field {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }
        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result {
            margin-top: 30px;
            padding: 25px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-left: 5px solid #3498db;
        }
        .error {
            color: #e74c3c;
            margin-top: 15px;
            font-weight: bold;
            padding: 10px;
            background-color: #fdedec;
            border-radius: 5px;
            display: none;
        }
        .formula {
            font-size: 18px;
            margin: 20px 0;
            padding: 20px;
            background-color: #e8f4fc;
            border-radius: 8px;
            text-align: center;
            overflow-x: auto;
        }
        .instructions {
            background-color: #e8f4fc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .instructions h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .katex-display {
            margin: 1rem 0;
            overflow-x: auto;
            overflow-y: hidden;
        }
        @media (max-width: 768px) {
            .input-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Helicity To LS</h1>

        <div class="instructions">
            <h3>User guide</h3>
            <p> Create the LS formula for the following decay </p>
            <div id="decay" class="formula"></div>
            <p> Set P=0 to allow P violation. The total formula is </p>
            <div id="formula" class="formula"></div>
        </div>

        <div class="input-group">
            <div class="input-field">
                <label for="j1">j₁</label>
                <input type="number" id="j1" step="0.5" value="1" min="0">
            </div>
            <div class="input-field">
                <label for="j2">j₂</label>
                <input type="number" id="j2" step="0.5" value="1" min="0">
            </div>
            <div class="input-field">
                <label for="J">J</label>
                <input type="number" id="J" step="0.5" value="0" min="0">
            </div>
            <div class="input-field">
                <label for="p1">P₁</label>
                <input type="number" id="p1" step="2" value="-1" min="-1" max="1">
            </div>
            <div class="input-field">
                <label for="p2">P₂</label>
                <input type="number" id="p2" step="2" value="-1" min="-1" max="1">
            </div>
            <div class="input-field">
                <label for="P">P</label>
                <input type="number" id="P" step="0" value="-1" min="-1" max="1">
            </div>
        </div>

        <button id="calculateBtn">start</button>

        <div id="error" class="error"></div>

        <div id="result" class="result" style="display: none;">
            <h2>Reuslts</h2>
            <div id="latexOutput"></div>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script>
        function fracAdd(a, b) {
            let num = a.numerator * b.denominator + b.numerator * a.denominator;
            let den = a.denominator * b.denominator;
            return simplifyFraction(num, den);
        }

        function fracMul(a, b) {
            return simplifyFraction(a.numerator * b.numerator, a.denominator * b.denominator);
        }

        function fracValue(v) {
            return v.numerator/ v.denominator;
        }


        function gcd(a, b) {
            if (a === 0) return b;
            if (b === 0) return a;
            if (a > b) return gcd(a % b , b);
            return gcd(b % a, a);
        }

        function simplifyFraction(numerator, denominator) {
            if (numerator === 0) return { numerator: 0, denominator: 1 };
            const commonDivisor = gcd(Math.abs(numerator), Math.abs(denominator));
            return {
                numerator: numerator / commonDivisor,
                denominator: denominator / commonDivisor
            };
        }

        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            return result;
        }


        function wigner_3j(j_1, j_2, j_3, m_1, m_2, m_3) {
            if (m_1 + m_2 + m_3 != 0) return {numerator: 0, denominator: 1};
            let a1 = j_1 + j_2 - j_3;
            if (a1 < 0) return {numerator: 0, denominator: 1};
            let a2 = j_1 - j_2 + j_3;
            if (a2 < 0) return {numerator: 0, denominator: 1};
            let a3 = -j_1 + j_2 + j_3;
            if (a3 < 0) return {numerator: 0, denominator: 1};
            if ((Math.abs(m_1) > j_1) || (Math.abs(m_2) > j_2) || (Math.abs(m_3) > j_3)) return  {numerator: 0, denominator: 1};
            let maxfact = Math.max(j_1 + j_2 + j_3 + 1, j_1 + Math.abs(m_1), j_2 + Math.abs(m_3), j_3 + Math.abs(m_3));

            let _Factlist = [1];
            let i = 1;
            for (i = 1; i<= maxfact; i+=1) {
                _Factlist.push(_Factlist[-1] * i);
            };
            let argsqrt = {numerator: factorial(j_1 + j_2 - j_3) *
                     factorial(j_1 - j_2 + j_3) *
                     factorial(-j_1 + j_2 + j_3) *
                     factorial(j_1 - m_1) *
                     factorial(j_1 + m_1) *
                     factorial(j_2 - m_2) *
                     factorial(j_2 + m_2) *
                     factorial(j_3 - m_3) *
                     factorial(j_3 + m_3),
                     denominator: factorial(j_1 + j_2 + j_3 + 1)};
            let ressqrt = argsqrt;
            let imin = Math.max(-j_3 + j_1 + m_2, -j_3 + j_2 - m_1, 0);
            let imax = Math.min(j_2 + m_2, j_1 - m_1, j_1 + j_2 - j_3);
            let sumres = {numerator: 0, denominator: 1};
            let ii;
            for (ii=imin; ii<= imax; ii+=1) {
                let den = factorial(ii) * factorial(ii + j_3 - j_1 - m_2) *  factorial(j_2 + m_2 - ii) * factorial(j_1 - ii - m_1) * factorial(ii + j_3 - j_2 + m_1) * factorial(j_1 + j_2 - j_3 - ii);
                sumres = fracAdd(sumres, {numerator: Math.pow(-1, ii), denominator: den});
            };
            let prefid = Math.pow(-1, j_1 - j_2 - m_3);
            let res = fracMul(fracMul(ressqrt, fracMul(sumres,sumres)), {numerator: prefid*prefid, denominator: 1})
            let sign = ((sumres.numerator*sumres.denominator * prefid) >= 0)? 1 : -1
            return {numerator: res.numerator * sign, denominator: res.denominator}
        }

        function clebschGordanFraction(j_1, m_1, j_2, m_2, j_3, m_3) {
            let w = wigner_3j(j_1, j_2, j_3, m_1, m_2, -m_3);
            let frac = Math.pow(-1, (j_1 - j_2 + m_3)) *  (2 * j_3 + 1)
            return fracMul( {numerator: frac, denominator: 1},  w)
        }

        function renderLatex(latexExpr, elementId) {
            const element = document.getElementById(elementId);
            katex.render(latexExpr, element, {
                throwOnError: false,
                displayMode: true
            });
        }

        function formatSpin(m) {
            if (Math.abs(2*m) % 2 != 1) return `${-m}`;
            else return (m< 0) ? `-\\frac{${-2*m}}{2}` : `\\frac{${2*m}}{2}`;
        }

        function calculateCG() {

            const j1 = parseFloat(document.getElementById('j1').value);
            const p1 = parseFloat(document.getElementById('p1').value);
            const j2 = parseFloat(document.getElementById('j2').value);
            const p2 = parseFloat(document.getElementById('p2').value);
            const J = parseFloat(document.getElementById('J').value);
            const P = parseFloat(document.getElementById('P').value);

            let ls = [];
            let l;
            let s;
            for (s=Math.abs(j1-j2);s<=j1+j2;s+=1) {
                for (l=Math.abs(J-s);l<=J+s;l+=1) {
                    let cp_cond = (p1 * p2 * P === Math.pow(-1, l))
                    if ( p1 === 0 || p2 === 0 || P === 0 || cp_cond) {
                        ls.push(  [l, s] );
                    }
                }
            }

            const errorElem = document.getElementById('error');
            errorElem.textContent = '';
            errorElem.style.display = 'none';
            if (ls.length === 0) {
                errorElem.textContent = 'no available LS';
                errorElem.style.display = 'block';
            }

            let m1, m2, lsi;
            let latexExpr =  `\\begin{aligned}`;
            for (m1=-j1; m1 <= j1; m1 += 1) {
                for (m2=-j2; m2 <= j2; m2 += 1) {
                    if (Math.abs(m1 - m2) > J) continue;
                    let tmp = `H_{ ${formatSpin(m1)}, ${formatSpin(m2)} } & = `;
                    let count = 0;
                    for (lsi = 0; lsi < ls.length;lsi+=1) {
                        let l = ls[lsi][0];
                        let s = ls[lsi][1];
                        const cgFraction1 = clebschGordanFraction(j1, m1, j2, -m2, s, m1- m2);
                        const cgFraction2 = clebschGordanFraction(l,0, s, m1- m2, J, m1 - m2);
                        const cgtotal = simplifyFraction(cgFraction1.numerator *cgFraction2.numerator * (2*l + 1), cgFraction1.denominator *cgFraction2.denominator * (2*J + 1));
                        let sign = (cgtotal.numerator * cgtotal.denominator < 0) ? `-` : `+`;
                        if (cgtotal.numerator != 0) {
                            tmp = `${tmp} ${sign} \\sqrt{ \\frac{${Math.abs(cgtotal.numerator)} }{  ${cgtotal.denominator}} } G_{${l}, ${formatSpin(s)}}  `;
                            count += 1;
                        }
                    }
                    if (count !=0 ){
                        latexExpr = `${latexExpr}  ${tmp} \\\\ `;
                    }
                }
            }
            latexExpr = `${latexExpr} \\end{aligned} `;

            renderLatex(latexExpr, 'latexOutput');
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').style.display = 'block';

            renderLatex(`H_{\\lambda_1,\\lambda_2} =\\sum_{l,s} \\sqrt{\\frac{2l+1}{2J+1}} \\langle j_1,m_1;j_2,-m_2|s,\\delta \\rangle\\langle l,0;s,\\delta|J,\\delta \\rangle G_{ls}`, 'formula');
        }

        function updateLatex() {

            renderLatex(`H_{\\lambda_1,\\lambda_2} =\\sum_{l,s} \\sqrt{\\frac{2l+1}{2J+1}} \\langle j_1,m_1;j_2,-m_2|s,\\delta \\rangle\\langle l,0;s,\\delta|J,\\delta \\rangle G_{ls}`, 'formula');

            document.getElementById('formula').style.display = 'block';

            renderLatex(`J^{P}\\rightarrow j_{1}^{P_1}  +  j_{2}^{P_2}`, 'decay');

            document.getElementById('decay').style.display = 'block';


            calculateCG();
        }

        document.getElementById('calculateBtn').addEventListener('click', calculateCG);

        window.onload = updateLatex;
    </script>
</body>
</html>
