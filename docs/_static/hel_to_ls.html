<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helicity To LS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .input-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        .input-field {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }
        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result {
            margin-top: 30px;
            padding: 25px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border-left: 5px solid #3498db;
        }
        .error {
            color: #e74c3c;
            margin-top: 15px;
            font-weight: bold;
            padding: 10px;
            background-color: #fdedec;
            border-radius: 5px;
            display: none;
        }
        .formula {
            font-size: 18px;
            margin: 20px 0;
            padding: 20px;
            background-color: #e8f4fc;
            border-radius: 8px;
            text-align: center;
            overflow-x: auto;
        }
        .instructions {
            background-color: #e8f4fc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .instructions h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .katex-display {
            margin: 1rem 0;
            overflow-x: auto;
            overflow-y: hidden;
        }
        @media (max-width: 768px) {
            .input-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Helicity To LS</h1>

        <div class="instructions">
            <h3>User guide</h3>
            <p> J P to J1 P1 + J2 P2 </p>
            <p> set P=0 to allow P violation </p>
        </div>

        <div class="input-group">
            <div class="input-field">
                <label for="j1">j₁</label>
                <input type="number" id="j1" step="0.5" value="1" min="0">
            </div>
            <div class="input-field">
                <label for="j2">j₂</label>
                <input type="number" id="j2" step="0.5" value="1" min="0">
            </div>
            <div class="input-field">
                <label for="J">J</label>
                <input type="number" id="J" step="0.5" value="1" min="0">
            </div>
            <div class="input-field">
                <label for="p1">P₁</label>
                <input type="number" id="p1" step="2" value="-1" min="-1" max="1">
            </div>
            <div class="input-field">
                <label for="p2">P₂</label>
                <input type="number" id="p2" step="2" value="-1" min="-1" max="1">
            </div>
            <div class="input-field">
                <label for="P">P</label>
                <input type="number" id="P" step="2" value="-1" min="-1" max="1">
            </div>
        </div>

        <button id="calculateBtn">start</button>

        <div id="error" class="error"></div>

        <div id="result" class="result" style="display: none;">
            <h2>Reuslts</h2>
            <div id="latexOutput"></div>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script>
        function gcd(a, b) {
            if (a === b) return a;
            if (a > b) return gcd( a- b, b);
            return gcd(b-a, a);
        }

        function simplifyFraction(numerator, denominator) {
            if (numerator === 0) return { numerator: 0, denominator: 1 };
            const commonDivisor = gcd(Math.abs(numerator), Math.abs(denominator));
            return {
                numerator: numerator / commonDivisor,
                denominator: denominator / commonDivisor
            };
        }

        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            return result;
        }

        function triangleCoefficient(j1, j2, j3) {
            return factorial(j1 + j2 - j3) *
                   factorial(j1 - j2 + j3) *
                   factorial(-j1 + j2 + j3) /
                   factorial(j1 + j2 + j3 + 1);
        }

        function clebschGordanFraction(j1, m1, j2, m2, J, M) {

            if (Math.abs(m1 + m2 - M) > 1e-10) return { numerator: 0, denominator: 1 };
            if (J < Math.abs(j1 - j2) || J > j1 + j2) return { numerator: 0, denominator: 1 };
            if (Math.abs(m1) > j1 || Math.abs(m2) > j2 || Math.abs(M) > J) return { numerator: 0, denominator: 1 };

            const factor = 2;
            const j1_int = j1 * factor;
            const m1_int = m1 * factor;
            const j2_int = j2 * factor;
            const j3_int = J * factor;
            const m3_int = M * factor;

            const term1 = (2 * J + 1) * triangleCoefficient(j1, j2, J);
            const term2 = factorial(J + M) * factorial(J - M) *
                         factorial(j1 - m1) * factorial(j1 + m1) *
                         factorial(j2 - m2) * factorial(j2 + m2);

            const cgSquared = term1 * term2;

            let sum = 0;
            const kMin = Math.max(0, j2 - J - m1, j1 - J + m2);
            const kMax = Math.min(j1 + j2 - J, j1 - m1, j2 + m2);

            for (let k = kMin; k <= kMax; k++) {
                const denominator = factorial(k) *
                                  factorial(j1 + j2 - J - k) *
                                  factorial(j1 - m1 - k) *
                                  factorial(j2 + m2 - k) *
                                  factorial(J - j2 + m1 + k) *
                                  factorial(J - j1 - m2 + k);

                if (denominator === 0) continue;

                const sign = (k % 2 === 0) ? 1 : -1;
                sum += sign / denominator;
            }

            const fullCgSquared = term1 * term2 * sum * sum;

            function findFraction(x, tolerance = 1e-10) {
                var d2, n2;
                for (d2=1;d2<1000;d2+=1) {
                    n2 = Math.floor(x * d2+0.5);
                    if (Math.abs(x - n2/d2) < tolerance) break;
                }

                return simplifyFraction(n2, d2);
            }

            const fraction = findFraction(fullCgSquared);

            const numericalCg = Math.sqrt(term1 * term2) * sum;
            const sign = numericalCg >= 0 ? 1 : -1;

            return {
                numerator: sign * fraction.numerator,
                denominator: fraction.denominator
            };
        }

        function renderLatex(latexExpr, elementId) {
            const element = document.getElementById(elementId);
            katex.render(latexExpr, element, {
                throwOnError: false,
                displayMode: true
            });
        }

        function calculateCG() {

            const j1 = parseFloat(document.getElementById('j1').value);
            const p1 = parseFloat(document.getElementById('p1').value);
            const j2 = parseFloat(document.getElementById('j2').value);
            const p2 = parseFloat(document.getElementById('p2').value);
            const J = parseFloat(document.getElementById('J').value);
            const P = parseFloat(document.getElementById('P').value);

            let ls = [];
            let l;
            let s;
            for (s=Math.abs(j1-j2);s<=j1+j2;s+=1) {
                for (l=Math.abs(J-s);l<=J+s;l+=1) {
                    let cp_cond = (p1 * p2 * P === Math.pow(-1, l))
                    if ( p1 === 0 || p2 === 0 || P === 0 || cp_cond) {
                        ls.push(  [l, s] );
                    }
                }
            }

            if (ls.length === 0) {
                const errorElem = document.getElementById('error');
                errorElem.textContent = 'no available LS';
                errorElem.style.display = 'block';
            }

            let m1, m2, lsi;
            let latexExpr =  `\\begin{aligned}`;
            for (m1=-j1; m1 <= j1; m1 += 1) {
                for (m2=-j2; m2 <= j2; m2 += 1) {
                    if (Math.abs(m1 - m2) > J) continue;
                    let tmp = `H_{ ${m1}, ${m2} } & = `;
                    let count = 0;
                    for (lsi = 0; lsi < ls.length;lsi+=1) {
                        let l = ls[lsi][0];
                        let s = ls[lsi][1];
                        const cgFraction1 = clebschGordanFraction(j1, m1, j2, -m2, s, m1- m2);
                        const cgFraction2 = clebschGordanFraction(l,0, s, m1- m2, J, m1 - m2);
                        const cgtotal = simplifyFraction(cgFraction1.numerator *cgFraction2.numerator * (2*l + 1), cgFraction1.denominator *cgFraction2.denominator * (2*J + 1));
                        let sign = cgtotal.numerator < 0 ? `-` : `+`;
                        if (cgtotal.numerator != 0) {
                            tmp = `${tmp} ${sign} \\sqrt{ \\frac{${Math.abs(cgtotal.numerator)} }{  ${cgtotal.denominator}} } g_{${l}, ${s}}  `;
                            count += 1;
                        }
                    }
                    if (count !=0 ){
                        latexExpr = `${latexExpr}  ${tmp} \\\\ `;
                    }
                }
            }
            latexExpr = `${latexExpr} \\end{aligned} `;

            renderLatex(latexExpr, 'latexOutput');

            document.getElementById('result').style.display = 'block';
        }

        document.getElementById('calculateBtn').addEventListener('click', calculateCG);

        window.onload = calculateCG;
    </script>
</body>
</html>
